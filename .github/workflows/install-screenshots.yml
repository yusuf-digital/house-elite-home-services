name: Install House Elite portfolio screenshots

on:
  push:
    branches: [main]
    paths:
      - 'screenshots_bundle.zip.base64'
      - '.github/workflows/install-screenshots.yml'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode portfolio screenshots
        shell: bash
        run: |
          base64 -d screenshots_bundle.zip.base64 > screenshots_bundle.zip
          unzip -o screenshots_bundle.zip
          rm -f screenshots_bundle.zip screenshots_bundle.zip.base64
          rm -f screenshots/*.txt screenshots/*.base64 screenshots/.upload-note.txt
          rm -f .github/workflows/install-screenshots.yml
      - name: Commit screenshots
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Add House Elite portfolio screenshots"
            git push
          fi
